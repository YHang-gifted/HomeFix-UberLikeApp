name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Security audit
        run: npm run security:audit

  app-expo:
    name: app-expo Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # The app-expo tests import the shared, tested logic at ../app/src and
      # ../shared, which import `zod` from the repo-root node_modules. Install the
      # root deps first so that resolution works, then the app-expo deps.
      - name: Install root dependencies
        run: npm ci

      - name: Install app-expo dependencies
        working-directory: app-expo
        run: npm ci

      - name: Lint app-expo
        working-directory: app-expo
        run: npm run lint

      - name: Typecheck app-expo
        working-directory: app-expo
        run: npm run typecheck

      - name: Test app-expo
        working-directory: app-expo
        run: npm run test:ci
